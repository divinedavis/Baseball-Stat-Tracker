name: BaseballStatTracker
options:
  bundleIdPrefix: com.divinedavis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "CG89RY4W6R"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  BaseballStatTracker:
    type: application
    platform: iOS
    sources:
      - path: BaseballStatTracker
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: BaseballStatTracker/Info.plist
      properties:
        CFBundleDisplayName: Barrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Barrel uses Face ID to confirm sensitive actions like deleting your account."
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            BarrelNight:
              CFBundleIconFiles:
                - BarrelNight
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.BaseballStatTracker
        CODE_SIGN_ENTITLEMENTS: BaseballStatTracker/BaseballStatTracker.entitlements
        CURRENT_PROJECT_VERSION: "71"
        MARKETING_VERSION: "1.2"
        TARGETED_DEVICE_FAMILY: "1"
  BaseballStatTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaseballStatTrackerTests
    dependencies:
      - target: BaseballStatTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.BaseballStatTrackerTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BaseballStatTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BaseballStatTracker
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: "YES"
  BaseballStatTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BaseballStatTrackerUITests
    dependencies:
      - target: BaseballStatTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.BaseballStatTrackerUITests
        TEST_TARGET_NAME: BaseballStatTracker
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  BaseballStatTracker:
    build:
      targets:
        BaseballStatTracker: all
        BaseballStatTrackerTests: [test]
        BaseballStatTrackerUITests: [test]
    test:
      targets:
        - BaseballStatTrackerTests
        - BaseballStatTrackerUITests
      gatherCoverageData: true
      coverageTargets:
        - BaseballStatTracker
    run:
      config: Debug
    archive:
      config: Release
